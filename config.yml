migrate:
  from: github
  to: gitee
  clone_dir: ""
  # git clone 额外参数（全局生效，也可在各 provider 下单独设置覆盖）
  # clone_args:
  #   - "--depth"
  #   - "1"
  #   - "--filter=blob:none"
  # git push 额外参数
  # push_args:
  #   - "--force"
  # 默认迁移所有代码仓，可以设置 repos 迁移特定的代码仓
  # repos:
  #   - repo_a
  #   - repo_b
  # 排除不需要迁移的代码仓（支持通配符）
  # * 匹配任意字符，? 匹配单个字符
  # 例如:
  #   "test_*"        排除所有 test_ 开头的仓库
  #   "*_backup"      排除所有 _backup 结尾的仓库
  #   "archived-*"    排除所有 archived- 开头的仓库
  #   "my-repo"       精确排除某个仓库
  # exclude_repos:
  #   - test_*
  #   - *_backup
  #   - archived-*

gitee:
  provider: gitee
  base_api: https://gitee.com/api/v5
  ssh_prefix: git@gitee.com
  https_prefix: https://gitee.com
  username: ""
  token: ""

github:
  provider: github
  base_api: https://api.github.com/graphql
  ssh_prefix: git@github.com
  https_prefix: https://github.com
  username: ""
  token: ""
  use_https: true

gitlab:
  provider": gitlab
  base_api: https://gitlab.com/api/v4
  ssh_prefix: git@gitlab.com
  https_prefix: https://gitlab.com
  username: ""
  token: ""

coding:
  provider: coding
  base_api: https://{your-team}.coding.net
  ssh_prefix: git@e.coding.net
  https_prefix: https://e.coding.net
  username: ""
  token: ""
  org_name: ""
  is_org: false
  use_web_base_api: true
  use_https: true
  web_cookie: ""

# 腾讯工蜂 https://code.tencent.com/
gongfeng:
  provider: gongfeng
  base_api: https://code.tencent.com/api/v3
  ssh_prefix: git@git.code.tencent.com
  https_prefix: https://git.code.tencent.com
  username: ""
  token: ""

gitea:
  provider: gitea
  base_api: https://gitea.com/api/v1
  ssh_prefix: git@gitea.com
  https_prefix: https://gitea.com
  username: ""
  token: ""

e_gitee_v8:
  provider: e_gitee_v8
  base_api: https://api.gitee.com/enterprises
  https_prefix: https://gitee.com
  enterprise_id: ""
  token: ""
  token_user: ""
  use_https: true
